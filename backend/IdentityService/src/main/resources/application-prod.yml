server:
  port: ${PORT:8081}
  address: 0.0.0.0

spring:
  application:
    name: IdentityService
  datasource:
    url: jdbc:sqlserver://${DB_HOST:sqlserver}:1433;databaseName=sports_store;encrypt=true;trustServerCertificate=true
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:123456}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: false

jwt:
  secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970337336763979244226452948404D6351}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

eureka:
  instance:
    hostname: ${EUREKA_INSTANCE_HOSTNAME:identity-service}
    instance-id: ${EUREKA_INSTANCE_HOSTNAME:identity-service}:${spring.application.name}:${server.port}
  client:
    restclient:
      enabled: true
    service-url:
      defaultZone: ${EUREKA_URI:http://discovery-server:8761/eureka/}
