server:
  port: 8081
  address: 0.0.0.0

spring:
  application:
    name: IdentityService

  datasource:
    url: jdbc:sqlserver://localhost:1433;databaseName=sports_store;encrypt=true;trustServerCertificate=true
    username: sa
    password: 12345
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.SQLServerDialect

jwt:
  secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970337336763979244226452948404D6351
  expiration-ms: 86400000

springdoc:
  swagger-ui:
    path: /swagger-ui.html

eureka:
  instance:
    hostname: localhost
    instance-id: localhost:${spring.application.name}:${server.port}
    status-page-url-path: /swagger-ui.html
    health-check-url-path: /v3/api-docs
  client:
    restclient:
      enabled: true
    service-url:
      defaultZone: http://localhost:8761/eureka/
