server:
  port: 8081
  address: 0.0.0.0

spring:
  application:
    name: IdentityService

  datasource:
    url: jdbc:sqlserver://localhost:1433;databaseName=sports_store;encrypt=true;trustServerCertificate=true
    username: sa
    password: 123456
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.SQLServerDialect

