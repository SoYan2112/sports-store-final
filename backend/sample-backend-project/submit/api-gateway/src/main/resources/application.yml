server:
  port: 8080
spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: car-service
              uri: http://localhost:8081
              predicates:
                - Path=/api/cars,/api/cars/**
            - id: renting-service
              uri: http://localhost:8082
              predicates:
                - Path=/api/rentings,/api/rentings/**
