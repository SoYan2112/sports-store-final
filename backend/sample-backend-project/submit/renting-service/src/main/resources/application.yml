server:
  port: 8082
spring:
  application:
    name: renting-service
  datasource:
    url: jdbc:sqlserver://localhost:1433;databaseName=FUCarRenting_RentingDB;encrypt=true;trustServerCertificate=true
    username: sa
    password: "123456"
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

services:
  car-url: http://localhost:8081
spring.cloud.openfeign.client.config.default:
  connectTimeout: 3000
  readTimeout: 5000
