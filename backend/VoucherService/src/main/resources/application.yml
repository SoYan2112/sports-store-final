server:
  port: 8084
  address: 0.0.0.0

spring:
  application:
    name: VoucherService

  datasource:
    url: jdbc:sqlserver://localhost:1433;databaseName=sports_store_voucher;encrypt=true;trustServerCertificate=true
    username: sa
    password: 123456

    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.SQLServerDialect

springdoc:
  swagger-ui:
    path: /swagger-ui.html

eureka:
  instance:
    hostname: localhost
    instance-id: localhost:${spring.application.name}:${server.port}
    status-page-url-path: /actuator/health
    health-check-url-path: /actuator/health
  client:
    restclient:
      enabled: true
    service-url:
      defaultZone: http://localhost:8761/eureka/

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: ${MANAGEMENT_ZIPKIN_TRACING_ENDPOINT:http://localhost:9411/api/v2/spans}
