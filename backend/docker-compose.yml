services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sports-store-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: "StrongPassword@123"
    ports:
      - "1433:1433"
    healthcheck:
      test: ["CMD-SHELL", "if [ -f /opt/mssql-tools18/bin/sqlcmd ]; then /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'StrongPassword@123' -C -Q 'SELECT 1'; else /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P 'StrongPassword@123' -Q 'SELECT 1'; fi"]
      interval: 10s
      timeout: 5s
      retries: 25
      start_period: 15s
    networks:
      - sports-store-net

  sqlserver-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sports-store-sqlserver-init
    depends_on:
      sqlserver:
        condition: service_healthy
    volumes:
      - ./init-db.sql:/init-db.sql:ro
    entrypoint: >
      /bin/bash -c "
      if [ -f /opt/mssql-tools18/bin/sqlcmd ]; then
        SQLCMD=/opt/mssql-tools18/bin/sqlcmd;
      else
        SQLCMD=/opt/mssql-tools/bin/sqlcmd;
      fi;
      echo 'Running database initialization script init-db.sql...';
      for i in {1..30}; do
        $$SQLCMD -S sqlserver -U sa -P 'StrongPassword@123' -C -d master -i /init-db.sql && break;
        echo 'Waiting for SQL Server to accept script execution, retrying in 2 seconds...';
        sleep 2;
      done;
      echo 'Database initialization completed successfully!';
      exit 0;
      "
    networks:
      - sports-store-net

  discovery-server:
    build:
      context: .
      dockerfile: DiscoveryServer/Dockerfile
    container_name: discovery-server
    ports:
      - "8761:8761"
    environment:
      SPRING_PROFILES_ACTIVE: prod
    networks:
      - sports-store-net

  config-server:
    build:
      context: .
      dockerfile: ConfigServer/Dockerfile
    container_name: config-server
    ports:
      - "8888:8888"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      EUREKA_URI: http://discovery-server:8761/eureka/
    depends_on:
      - discovery-server
    networks:
      - sports-store-net

  api-gateway:
    build:
      context: .
      dockerfile: ApiGateway/Dockerfile
    container_name: api-gateway
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      EUREKA_URI: http://discovery-server:8761/eureka/
    depends_on:
      - discovery-server
    networks:
      - sports-store-net

  identity-service:
    build:
      context: .
      dockerfile: IdentityService/Dockerfile
    container_name: identity-service
    ports:
      - "8081:8081"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: sqlserver
      DB_PASSWORD: "StrongPassword@123"
      EUREKA_URI: http://discovery-server:8761/eureka/
    depends_on:
      sqlserver-init:
        condition: service_completed_successfully
      discovery-server:
        condition: service_started
    networks:
      - sports-store-net

  product-service:
    build:
      context: .
      dockerfile: ProductService/Dockerfile
    container_name: product-service
    ports:
      - "8082:8082"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: sqlserver
      DB_PASSWORD: "StrongPassword@123"
      EUREKA_URI: http://discovery-server:8761/eureka/
    depends_on:
      sqlserver-init:
        condition: service_completed_successfully
      discovery-server:
        condition: service_started
    networks:
      - sports-store-net

  order-service:
    build:
      context: .
      dockerfile: OrderService/Dockerfile
    container_name: order-service
    ports:
      - "8083:8083"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: sqlserver
      DB_PASSWORD: "StrongPassword@123"
      PRODUCT_SERVICE_URL: http://product-service:8082
      EUREKA_URI: http://discovery-server:8761/eureka/
    depends_on:
      sqlserver-init:
        condition: service_completed_successfully
      discovery-server:
        condition: service_started
    networks:
      - sports-store-net

  voucher-service:
    build:
      context: .
      dockerfile: VoucherService/Dockerfile
    container_name: voucher-service
    ports:
      - "8084:8084"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: sqlserver
      DB_PASSWORD: "StrongPassword@123"
      EUREKA_URI: http://discovery-server:8761/eureka/
    depends_on:
      sqlserver-init:
        condition: service_completed_successfully
      discovery-server:
        condition: service_started
    networks:
      - sports-store-net

  prometheus:
    image: prom/prometheus:latest
    container_name: sports-store-prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    depends_on:
      - api-gateway
      - discovery-server
    networks:
      - sports-store-net

  zipkin:
    image: openzipkin/zipkin:latest
    container_name: sports-store-zipkin
    ports:
      - "9411:9411"
    environment:
      JAVA_OPTS: "-Xms128m -Xmx256m -XX:+ExitOnOutOfMemoryError"
    networks:
      - sports-store-net

  grafana:
    image: grafana/grafana:latest
    container_name: sports-store-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    networks:
      - sports-store-net

  elasticsearch:
    image: elasticsearch:7.17.24
    container_name: sports-store-elasticsearch
    environment:
      discovery.type: single-node
      ES_JAVA_OPTS: "-Xms256m -Xmx512m"
      xpack.security.enabled: "false"
    ports:
      - "9200:9200"
      - "9300:9300"
    networks:
      - sports-store-net

  logstash:
    image: logstash:7.17.24
    container_name: sports-store-logstash
    volumes:
      - ./logstash/pipeline:/usr/share/logstash/pipeline:ro
    ports:
      - "5000:5000"
    environment:
      LS_JAVA_OPTS: "-Xms128m -Xmx256m"
    depends_on:
      - elasticsearch
    networks:
      - sports-store-net

  kibana:
    image: kibana:7.17.24
    container_name: sports-store-kibana
    ports:
      - "5601:5601"
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    depends_on:
      - elasticsearch
    networks:
      - sports-store-net

  rabbitmq:
    image: rabbitmq:3-management
    container_name: sports-store-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    networks:
      - sports-store-net

networks:
  sports-store-net:
    driver: bridge
